name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# Avoid duplicate runs when a PR is opened from the same repo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read      # default read-only
  # release and docker jobs each elevate locally with their own permissions: block 

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
          cabal-update: true

      - name: cabal check
        run: cabal check

      - name: HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.8'

      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: warning

  # ── Build, test, bench ──────────────────────────────────────────
  build:
    name: Build / ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: '9.6.7'
            cabal: '3.10.3.0'
            artifact-name: linux-x86_64
            exe: ''
          - os: macos-latest
            ghc: '9.6.7'
            cabal: '3.10.3.0'
            artifact-name: macos-aarch64
            exe: ''
          - os: windows-latest
            ghc: '9.6.7'
            cabal: '3.10.3.0'
            artifact-name: windows-x86_64
            exe: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC ${{ matrix.ghc }}
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
          cabal-update: true

      - name: Configure
        run: |
          cabal configure --enable-tests --disable-documentation
          cabal build all --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      # The end-to-end demo exercises every CLI command against the shipped scenarios.
      - name: Demo smoke test
        if: runner.os != 'Windows'
        run: bash scenarios/demo/run-demo.sh

      - name: Install binaries
        shell: bash
        run: |
          mkdir -p bin
          cabal install exe:palisade --install-method=copy --overwrite-policy=always --installdir=bin

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: bin/palisade${{ matrix.exe }}
          retention-days: 90

  # ── Release (tag pushes only) ───────────────────────────────────
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten artifact subdirs and give each binary a distinct name
      - name: Stage release binaries
        run: |
          mkdir -p release
          mv artifacts/linux-x86_64/palisade       release/palisade-linux-x86_64
          mv artifacts/macos-aarch64/palisade      release/palisade-macos-aarch64
          mv artifacts/windows-x86_64/palisade.exe release/palisade-windows-x86_64.exe
          chmod +x release/*-linux-x86_64 release/*-macos-aarch64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            release/*

  # ── Docker build + push to GHCR ────────────────────────────────────────
  docker:
    name: Docker
    needs: build
    # Run on pushes to master AND on version tags; skip PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Enable multi-platforrm builds (linux/amd64 + linux/arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derive image tags + OCI labels from git context automatically:
      #   push to master  → ghcr.io/OWNER/palisade:latest
      #   push tag v1.2.3 → ghcr.io/OWNER/palisade:1.2.3, :1.2, :1, :latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/palisade
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in the GitHub Actions cache (free, no registry needed)
          cache-from: type=gha
          cache-to: type=gha,mode=max
